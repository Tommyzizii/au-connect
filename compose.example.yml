services:
  au-connect:
    image: minn01/au-connect:latest
    container_name: au-connect-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully

    ports:
      - "3000:3000"

    environment:
      - DATABASE_URL=mongodb://mongo:27017/au-connect?directConnection=true
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - LINKEDIN_CLIENT_ID=
      - LINKEDIN_CLIENT_SECRET=
      - MICROSOFT_CLIENT_ID=
      - MICROSOFT_CLIENT_SECRET=
      - AZURE_STORAGE_ACCOUNT_KEY=
      - AZURE_STORAGE_ACCOUNT_NAME=
      - AZURE_STORAGE_CONNECTION_STRING=
      - AZURE_STORAGE_CONTAINER_NAME=
      - APP_PUBLIC_URL=http://localhost:3000/connect
      - RECOMMENDATION_SERVICE_URL=http://host.docker.internal:8000
      - RECOMMENDATION_SERVICE_API_KEY=replace-with-shared-secret
      - SENDGRID_API_KEY=
      - EMAIL_FROM=
      - NODE_ENV=development
      - JWT_SECRET=

    networks:
      - au-network

  mongo:
    image: mongo:7
    container_name: au-connect-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ac-mongo-data:/data/db
    networks:
      - au-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 10

  # One-time replica set initialization
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - au-network
    restart: "no"
    entrypoint: |
      bash -c '
        echo "Waiting for Mongo...";
        sleep 5;
        mongosh --host mongo:27017 --eval "
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongo:27017\" }]
          })
        ";
        echo "Replica set initialized";
      '

networks:
  au-network:

volumes:
  ac-mongo-data:
